<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Heart Disease Prediction</h1>
        <p>
            Machine Learning Based Prediction System
        </p>
    </div>
    <form
        action="/predict"
        method="post"
        class="form"
    >
           <div class="input-group">
           <label>Age</label>
            <input
                type="number"
                name="age"
                placeholder="Enter age"
                required
            >
        </div>
        <div class="input-group">
            <label>Sex</label>
            <select name="sex" required>
                <option value="">Select</option>
                <option value="1">
                    Male
                </option>
                <option value="0">
                    Female
                </option>
            </select>
        </div>
        <div class="input-group">
            <label>Chest Pain Type</label>
            <select name="cp" required>
                <option value="">Select</option>
                <option value="0">Type 0</option>
                <option value="1">Type 1</option>
                <option value="2">Type 2</option>
                <option value="3">Type 3</option>
            </select>
        </div>
        <div class="input-group">
            <label>Resting Blood Pressure</label>
           <input
                type="number"
                name="trestbps"
                placeholder="e.g. 120"
                required
            >
        </div>
        <div class="input-group">
            <label>Cholesterol</label>
            <input
                type="number"
                name="chol"
                placeholder="e.g. 200"
                required
            >
        </div>
        <div class="input-group">
            <label>Fasting Blood Sugar</label>
            <select name="fbs" required>
                <option value="">Select</option>
                <option value="1">
                    Greater than 120
                </option>
                <option value="0">
                    Less than or equal to 120
                </option>
            </select>
        </div>
        <div class="input-group">
            <label>Resting ECG</label>
            <select name="restecg" required>
                <option value="">Select</option>
                <option value="0">Normal</option>
                <option value="1">
                    ST-T Wave Abnormality
                </option>
                <option value="2">
                    Left Ventricular Hypertrophy
                </option>
            </select>
        </div>
        <div class="input-group">
            <label>Maximum Heart Rate</label>
            <input
                type="number"
                name="thalach"
                placeholder="e.g. 150"
                required
            >
        </div>
        <div class="input-group">
            <label>Exercise Induced Angina</label>
            <select name="exang" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>
        <div class="input-group">
            <label>ST Depression (Oldpeak)</label>
            <input
                type="number"
                step="0.1"
                name="oldpeak"
                placeholder="e.g. 1.5"
                required
            >
        </div>
        <div class="input-group">
            <label>Slope</label>
            <select name="slope" required>
                <option value="">Select</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>
        <div class="input-group">
            <label>Number of Major Vessels (CA)</label>
            <select name="ca" required>
                <option value="">Select</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="input-group">
            <label>Thal</label>
            <select name="thal" required>
                <option value="">Select</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <button
            type="submit"
        >
            Predict Heart Disease
        </button>
    </form>
    {% if result %}
    <div class="result {{ status }}">
        <h2>
            {{ result }}
        </h2>
        <p>
            Model Confidence:
            <strong>
                {{ confidence }}%
            </strong>
        </p>
    </div>
    {% endif %}
</div>
</body>
</html>
